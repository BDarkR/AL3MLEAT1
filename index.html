<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تقرير العمليات - الميناء</title>
  <style>
    :root{
      --accent:#27ae60;
      --muted:#9b9b9b;
      --bg:#0b0b0b;
      --card:#1d1c1c;
    }
    *{
      box-sizing:border-box;
    }
    html, body{
      height:100%;
      margin:0;
    }
    body{
      font-family:'Cairo', sans-serif;
      background:var(--bg);
      color:#eee;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:18px;
    }
    .bg-mark{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      background: linear-gradient(rgba(11,11,11,0.6), rgba(11,11,11,0.6)), url("./1.png") center/cover no-repeat;
      pointer-events:none;
      filter:blur(1.8px);
      transform: scale(1.02);
      opacity:0.95;
      z-index:-1;
      background-blend-mode:multiply;
    }
    .card{
      max-width:900px;
      margin:0 auto;
      background:var(--card);
      border-radius:12px;
      padding:20px;
      box-shadow:0 8px 30px rgba(0,0,0,0.6);
    }
    .title{
      text-align:center;
      color:var(--accent);
      margin:0 0 16px;
      font-size:26px;
    }
    .small-note{
      color:var(--muted);
      font-size:14px;
      text-align:center;
      margin-bottom:20px;
    }
    .controls{
      display:flex;
      gap:10px;
      margin-top:10px;
      justify-content:center;
    }
    .btn{
      text-align:center;
      padding:10px 20px;
      border-radius:6px;
      font-weight:bold;
      cursor:pointer;
    }
    .btn.primary{
      background:var(--accent);
      color:#fff;
      border:none;
    }
    .btn.secondary{
      background:transparent;
      color:var(--accent);
      border:2px solid var(--accent);
    }
    .report-output{
      width:100%;
      height:250px;
      resize:none;
      padding:15px;
      background:#222;
      color:#ddd;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.1);
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div class="bg-mark" aria-hidden="true"></div>

  <section class="card">
    <h1 class="title">تقرير العمليات - الميناء</h1>
    <p class="small-note">اضغط على "إنشاء التقرير" لتوليد التقرير، واستخدم النسخ عند الحاجة.</p>

    <div class="controls">
      <button type="button" id="buildReport" class="btn primary">إنشاء التقرير</button>
      <button type="button" id="copyReport" class="btn secondary" style="display:none">نسخ التقرير</button>
    </div>

    <textarea id="reportOutput" class="report-output" placeholder="سيظهر التقرير هنا..."></textarea>
  </section>

  <script>
    function buildReportText() {
      // Header Section
      const lines = [];
      lines.push("تم استلام مهام نائب العمليات الميناء في تمام الساعة 01:00 ص الى 01:00 ص");
      lines.push("");
      lines.push("مركز العمليات الميناء : @منشن عمليات الميناء");
      lines.push("مركز العمليات لوس : @منشن عمليات لوس");
      lines.push("نائب مركز العمليات : @منشن نائب العمليات");
      lines.push("");
      lines.push("—————————————————");
      lines.push("");
      lines.push("القائمة الرئيسية :");
      lines.push("");
      lines.push("م قيادة | H-000");
      lines.push("درع 1 | H-000");
      lines.push("برق 1 | H-000");
      lines.push("صقر 1 | H-000");
      lines.push("سهم 1 | H-000");
      lines.push("سهم 2 | H-000");
      lines.push("مشرف أمن 1 | H-000");
      lines.push("امن 1 | H-000");
      lines.push("امن 2 | H-000");
      lines.push("اسماك 1 | H-000");
      lines.push("الشرطة العسكرية | H-000");
      lines.push("");
      lines.push("—————————————————");
      lines.push("");
      lines.push("وحدات مدينة لوس :");
      lines.push("");
      lines.push("ساهر 1 | H-000");
      lines.push("ساهر 2 | H-000");
      lines.push("ساهر 3 | H-000");
      lines.push("ساهر 4 | H-000");
      lines.push("ساهر 5 | H-000");
      lines.push("");
      lines.push("—————————————————");
      lines.push("");
      lines.push("وحدات الميناء :");
      lines.push("");
      lines.push("حرة 1 | H-000");
      lines.push("حرة 2 | H-000");
      lines.push("حرة 3 | H-000");
      lines.push("حرة 4 | H-000");
      lines.push("حرة 5 | H-000");
      lines.push("");
      lines.push("—————————————————");
      lines.push("");
      lines.push("الدورات المفعلة  :");
      lines.push("");
      lines.push("البحث الجنائي :");
      lines.push("قائد فرقة البحث الجنائي | H-000");
      lines.push("نائب الفرقة | H-000");
      lines.push("جنائي 1 | H-000");
      lines.push("جنائي 2 | H-000");
      lines.push("");
      lines.push("القوات الخاصة | SWAT :");
      lines.push("حزم 1 | H-000");
      lines.push("رمح 1 | H-000");
      lines.push("");
      lines.push("الأمن والحماية :");
      lines.push("حماية 1 | H-000");
      lines.push("حماية 2 | H-000");
      lines.push("");
      lines.push("عين 1 | H-000");
      lines.push("ساحل 1 | H-000");
      lines.push("سجن 1 | H-000");
      return lines.join("\n");
    }

    const buildBtn = document.getElementById("buildReport");
    const copyBtn = document.getElementById("copyReport");
    const output = document.getElementById("reportOutput");

    buildBtn.addEventListener("click", () => {
      const report = buildReportText();
      output.value = report;
      copyBtn.style.display = "inline-block";
      output.focus();
      output.select();
    });

    copyBtn.addEventListener("click", async () => {
      if (!output.value) return alert("لا يوجد تقرير لنسخه");
      try {
        await navigator.clipboard.writeText(output.value);
        copyBtn.textContent = "تم النسخ ✓";
        setTimeout(() => {
          copyBtn.textContent = "نسخ التقرير";
        }, 1500);
      } catch (err) {
        alert("حدث خطأ أثناء النسخ. يرجى المحاولة يدويًا.");
      }
    });
  </script>
</body>
</html>
