<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقرير نائب عمليات الميناء</title>
<style>
body{
  background:#0f172a;
  color:#e5e7eb;
  font-family:Tahoma,Arial;
  padding:20px;
}
h2{margin-top:30px}
.row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
label{width:160px}
input{
  flex:1;
  padding:6px;
  background:#020617;
  border:1px solid #334155;
  color:#e5e7eb;
  border-radius:4px;
}
button{
  padding:6px 12px;
  background:#2563eb;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
.add-btn{
  background:#16a34a;
  margin-bottom:10px;
}
textarea{
  width:100%;
  height:420px;
  margin-top:15px;
  background:#020617;
  color:#e5e7eb;
  border:1px solid #334155;
  padding:10px;
  border-radius:6px;
  white-space:pre;
}
</style>
</head>

<body>

<h1>تقرير نائب عمليات الميناء</h1>

<h2>الاستلام</h2>
<div class="row"><label>من</label><input id="from" value="01:00 ص"></div>
<div class="row"><label>إلى</label><input id="to" value="01:00 ص"></div>

<h2>العمليات (منشن فقط)</h2>
<div class="row"><label>مركز عمليات الميناء</label><input id="opsPort" placeholder="@"></div>
<div class="row"><label>مركز عمليات لوس</label><input id="opsLos" placeholder="@"></div>
<div class="row"><label>نائب مركز العمليات</label><input id="opsDeputy" placeholder="@"></div>

<h2>القائمة الرئيسية</h2>
<div id="mainUnits"></div>
<button class="add-btn" onclick="addUnit('mainUnits','سهم')">＋ إضافة سهم</button>

<h2>وحدات مدينة لوس</h2>
<div id="losUnits"></div>
<button class="add-btn" onclick="addUnit('losUnits','ساهر')">＋ إضافة ساهر</button>

<h2>وحدات الميناء</h2>
<div id="portUnits"></div>
<button class="add-btn" onclick="addUnit('portUnits','حرة')">＋ إضافة حرة</button>

<button onclick="buildReport()">إنشاء التقرير</button>
<button onclick="copyReport()">نسخ التقرير</button>

<textarea id="output"></textarea>

<script>
const SEP = '—————————————————';

function addUnit(containerId, name){
  const box = document.getElementById(containerId);
  const count = box.children.length + 1;

  const row = document.createElement('div');
  row.className = 'row';

  const label = document.createElement('label');
  label.textContent = `${name} ${count}`;

  const input = document.createElement('input');
  input.value = 'H-000';

  row.appendChild(label);
  row.appendChild(input);
  box.appendChild(row);
}

function buildList(container, title, out){
  if(container.children.length === 0) return;
  out.push(title);
  out.push('');
  [...container.children].forEach(r=>{
    const name = r.children[0].textContent;
    const code = r.children[1].value || 'H-000';
    out.push(`${name} | ${code}`);
  });
}

function buildReport(){
  const out = [];

  out.push(`تم استلام مهام نائب العمليات الميناء في تمام الساعة ${from.value} الى ${to.value}`);
  out.push('');
  out.push(`مركز العمليات الميناء : ${opsPort.value}`);
  out.push(`مركز العمليات لوس : ${opsLos.value}`);
  out.push(`نائب مركز العمليات : ${opsDeputy.value}`);
  out.push('');
  out.push(SEP);
  out.push('');

  buildList(mainUnits,'القائمة الرئيسية :',out);
  out.push('');
  out.push(SEP);
  out.push('');

  buildList(losUnits,'وحدات مدينة لوس :',out);
  out.push('');
  out.push(SEP);
  out.push('');

  buildList(portUnits,'وحدات الميناء :',out);

  output.value = out.join('\n');
}

function copyReport(){
  output.select();
  document.execCommand('copy');
}
</script>

</body>
</html>
