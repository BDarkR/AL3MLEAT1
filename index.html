<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>التقرير الجديد - ميناء العمليات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #27ae60;
      --secondary-color: #9b9b9b;
      --background-color: #0b0b0b;
      --card-background: #1d1c1c;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: var(--background-color);
      color: #eee;
      direction: rtl;
      text-align: right;
      padding: 20px;
    }

    .report-container {
      max-width: 800px;
      background: var(--card-background);
      border-radius: 10px;
      padding: 20px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .form-group {
      padding: 10px 0;
    }

    .form-group label {
      display: inline-block;
      width: 200px;
      font-size: 14px;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .form-group input {
      display: inline-block;
      width: calc(100% - 220px);
      padding: 6px;
      background: #222;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      color: #eee;
      font-family: 'Cairo', sans-serif;
    }

    .custom-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .group-separator {
      height: 15px;
    }

    .item-input {
      flex-grow: 1;
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #222;
      color: #eee;
    }

    .add-btn, .custom-btn {
      background: transparent;
      color: var(--primary-color);
      border: 1px dashed var(--primary-color);
      border-radius: 5px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-btn:hover, .custom-btn:hover {
      background: var(--primary-color);
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex-grow: 1;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .btn.primary {
      background: var(--primary-color);
      color: #fff;
      border: none;
    }

    .btn.secondary {
      background: transparent;
      color: var(--primary-color);
      border: 1px dashed var(--primary-color);
    }

    #reportOutput {
      width: 100%;
      min-height: 150px;
      padding: 10px;
      margin-top: 20px;
      background: #222;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #eee;
      border-radius: 5px;
      resize: none;
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body>
  <div class="report-container">
    <h1>تقرير العمليات الجديد</h1>

    <!-- الحقول الخاصة بالعمليات -->
    <div class="form-group">
      <div class="item-row">
        <label for="reportTimeInput">وقت التقرير:</label>
        <input type="text" id="reportTimeInput" class="item-input" value="01:00 ص الى 01:00 ص" />
      </div>
      <div class="item-row">
        <label for="portOperationsInput">مركز العمليات الميناء:</label>
        <input type="text" id="portOperationsInput" class="item-input" value="@منشن عمليات الميناء" />
      </div>
      <div class="item-row">
        <label for="losOperationsInput">مركز العمليات لوس:</label>
        <input type="text" id="losOperationsInput" class="item-input" value="@منشن عمليات لوس" />
      </div>
      <div class="item-row">
        <label for="deputyOperationsInput">نائب مركز العمليات:</label>
        <input type="text" id="deputyOperationsInput" class="item-input" value="@منشن نائب العمليات" />
      </div>
    </div>

    <hr />

    <!-- القائمة الرئيسية -->
    <div class="section">
      <div class="section-title">القائمة الرئيسية:</div>
      <div class="custom-actions">
        <button class="custom-btn" onclick="addRank('م قيادة', false)">+ م قيادة</button>
        <button class="custom-btn" onclick="addRank('درع', true)">+ درع</button>
        <button class="custom-btn" onclick="addRank('برق', true)">+ برق</button>
        <button class="custom-btn" onclick="addRank('صقر', true)">+ صقر</button>
        <button class="custom-btn" onclick="addRank('سهم', true)">+ سهم</button>
        <button class="custom-btn" onclick="addRank('أسماك', true)">+ أسماك</button>
      </div>
      <div id="mainList">
        <div class="item-row"><input type="text" class="item-input" value="م قيادة | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="group-separator"></div>
        <div class="item-row"><input type="text" class="item-input" value="درع 1 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="group-separator"></div>
        <div class="item-row"><input type="text" class="item-input" value="برق 1 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="group-separator"></div>
        <div class="item-row"><input type="text" class="item-input" value="صقر 1 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="group-separator"></div>
        <div class="item-row"><input type="text" class="item-input" value="سهم 1 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="item-row"><input type="text" class="item-input" value="سهم 2 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="group-separator"></div>
        <div class="item-row"><input type="text" class="item-input" value="مشرف أمن 1 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="item-row"><input type="text" class="item-input" value="مشرف أمن 2 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="group-separator"></div>
        <div class="item-row"><input type="text" class="item-input" value="أمن 1 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="item-row"><input type="text" class="item-input" value="أمن 2 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="group-separator"></div>
        <div class="item-row"><input type="text" class="item-input" value="أسماك 1 | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
        <div class="group-separator"></div>
        <div class="item-row"><input type="text" class="item-input" value="الشرطة العسكرية | H-000" /><button class="add-btn" onclick="removeItem(this)">حذف</button></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" onclick="generateReport()">إنشاء التقرير</button>
      <button class="btn secondary" onclick="copyToClipboard()">نسخ التقرير</button>
    </div>

    <textarea id="reportOutput" readonly placeholder="سيتم إنشاء التقرير هنا..."></textarea>
  </div>

  <script>
    function addRank(type, withNumber = true) {
      const mainList = document.getElementById("mainList");
      let newElementValue;

      if (withNumber) {
        const existingItems = Array.from(mainList.querySelectorAll(".item-input"));
        let highestCount = 0;

        existingItems.forEach((item) => {
          const value = item.value;
          if (value.startsWith(type)) {
            const match = value.match(/\d+/);
            if (match) {
              const number = parseInt(match[0], 10);
              if (number > highestCount) {
                highestCount = number;
              }
            }
          }
        });

        newElementValue = `${type} ${highestCount + 1} | H-000`;
      } else {
        newElementValue = `${type} | H-000`;
      }

      const newRow = document.createElement("div");
      newRow.className = "item-row";
      newRow.innerHTML = `
        <input type="text" class="item-input" value="${newElementValue}" />
        <button class="add-btn" onclick="removeItem(this)">حذف</button>
      `;

      const rows = Array.from(mainList.children);
      let lastSameTypeRow = null;

      rows.forEach((item) => {
        if (item.querySelector(".item-input") && item.querySelector(".item-input").value.startsWith(type)) {
          lastSameTypeRow = item;
        }
      });

      if (lastSameTypeRow) {
        lastSameTypeRow.insertAdjacentElement("afterend", newRow);
      } else {
        if (mainList.lastChild && !mainList.lastChild.classList.contains("group-separator")) {
          const separator = document.createElement("div");
          separator.className = "group-separator";
          mainList.appendChild(separator);
        }
        mainList.appendChild(newRow);
      }
    }

    function generateReport() {
      const reportTime = document.getElementById("reportTimeInput").value;
      const portOperations = document.getElementById("portOperationsInput").value;
      const losOperations = document.getElementById("losOperationsInput").value;
      const deputyOperations = document.getElementById("deputyOperationsInput").value;

      let reportText = `وقت التقرير: ${reportTime}\nمركز العمليات الميناء: ${portOperations}\nمركز العمليات لوس: ${losOperations}\nنائب مركز العمليات: ${deputyOperations}\n\n\nالقائمة الرئيسية:\n\n`;

      let previousCategory = "";
      const rows = Array.from(document.querySelectorAll("#mainList .item-row"));
      rows.forEach((row, index) => {
        const input = row.querySelector(".item-input");
        const value = input.value.trim();
        const groupName = value.split(" ")[0]; // Extract the category name

        // Add a blank line before a new category
        if (index === 0 || groupName !== previousCategory) {
          if (index !== 0) {
            reportText += "\n";
          }
          previousCategory = groupName;
        }

        reportText += `${value}\n`;
      });

      document.getElementById("reportOutput").value = reportText.trim();
    }

    function copyToClipboard() {
      const reportOutput = document.getElementById("reportOutput");
      if (!reportOutput.value.trim()) {
        alert("��ا يوجد تقرير لنسخه!");
        return;
      }
      reportOutput.select();
      document.execCommand("copy");
      alert("تم نسخ التقرير بنجاح!");
    }

    function removeItem(button) {
      const parent = button.parentElement;
      parent.remove();
    }
  </script>
</body>
</html>
