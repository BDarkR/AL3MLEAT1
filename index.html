<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تقرير العمليات - الميناء</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      font-family:'Cairo', Arial, sans-serif;
      background:#0b0b0b;
      color:#eee;
      padding:18px;
    }
    .card{
      max-width:1100px;
      margin:auto;
      background:#1c1c1c;
      border-radius:12px;
      padding:18px;
    }
    .title{
      text-align:center;
      color:#27ae60;
      margin-bottom:10px;
    }
    .row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
    label{min-width:180px}
    input{
      flex:1;
      padding:8px;
      border-radius:6px;
      border:1px solid #333;
      background:#222;
      color:#eee;
    }
    textarea{
      width:100%;
      min-height:260px;
      background:#222;
      color:#eee;
      border-radius:8px;
      padding:12px;
      border:1px solid #333;
      white-space:pre-wrap;
    }
    button{
      padding:10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      background:#27ae60;
      color:#fff;
      font-weight:bold;
    }
  </style>
</head>

<body>

<section class="card">
  <h1 class="title">إنشاء تقرير نائب العمليات</h1>

  <div class="row">
    <label>وقت البداية</label>
    <input id="timeFrom" value="01:00 ص">
  </div>

  <div class="row">
    <label>وقت النهاية</label>
    <input id="timeTo" value="01:00 ص">
  </div>

  <div class="row">
    <label>مركز عمليات الميناء</label>
    <input id="opsPort" placeholder="@">
  </div>

  <div class="row">
    <label>مركز عمليات لوس</label>
    <input id="opsLos" placeholder="@">
  </div>

  <div class="row">
    <label>نائب مركز العمليات</label>
    <input id="opsDeputy" placeholder="@">
  </div>

  <button onclick="buildReport()">إنشاء التقرير</button>

  <br><br>

  <textarea id="output" placeholder="سيظهر التقرير هنا"></textarea>
</section>

<script>
const SEPARATOR = '—————————————————';

function v(id){
  const val = document.getElementById(id).value.trim();
  if(!val) return 'H-000';
  return val.startsWith('@') ? val : '@' + val;
}

function buildReport(){
  const out = [];

  out.push(
    `تم استلام مهام نائب العمليات الميناء في تمام الساعة ${timeFrom.value} الى ${timeTo.value}`
  );
  out.push('');

  out.push(`مركز العمليات الميناء : ${v('opsPort')}`);
  out.push(`مركز العمليات لوس : ${v('opsLos')}`);
  out.push(`نائب مركز العمليات : ${v('opsDeputy')}`);
  out.push('');
  out.push(SEPARATOR);
  out.push('');

  out.push('القائمة الرئيسية :');
  out.push('');
  out.push('م قيادة | H-000');
  out.push('درع 1 | H-000');
  out.push('برق 1 | H-000');
  out.push('صقر 1 | H-000');
  out.push('سهم 1 | H-000');
  out.push('سهم 2 | H-000');
  out.push('مشرف أمن 1 | H-000');
  out.push('امن 1 | H-000');
  out.push('امن 2 | H-000');
  out.push('اسماك 1 | H-000');
  out.push('الشرطة العسكرية | H-000');

  out.push('');
  out.push(SEPARATOR);
  out.push('');

  out.push('وحدات مدينة لوس :');
  out.push('');
  out.push('ساهر 1 | H-000');
  out.push('ساهر 2 | H-000');
  out.push('ساهر 3 | H-000');
  out.push('ساهر 4 | H-000');
  out.push('ساهر 5 | H-000');

  out.push('');
  out.push(SEPARATOR);
  out.push('');

  out.push('وحدات الميناء :');
  out.push('');
  out.push('حرة 1 | H-000');
  out.push('حرة 2 | H-000');
  out.push('حرة 3 | H-000');
  out.push('حرة 4 | H-000');
  out.push('حرة 5 | H-000');

  out.push('');
  out.push(SEPARATOR);
  out.push('');

  out.push('الدورات المفعلة  :');
  out.push('');
  out.push('البحث الجنائي :');
  out.push('قائد فرقة البحث الجنائي | H-000');
  out.push('نائب الفرقة | H-000');
  out.push('جنائي 1 | H-000');
  out.push('جنائي 2 | H-000');
  out.push('');
  out.push('القوات الخاصة | SWAT :');
  out.push('حزم 1 | H-000');
  out.push('رمح 1 | H-000');
  out.push('');
  out.push('الأمن والحماية :');
  out.push('حماية 1 | H-000');
  out.push('حماية 2 | H-000');
  out.push('');
  out.push('عين 1 | H-000');
  out.push('ساحل 1 | H-000');
  out.push('سجن 1 | H-000');

  output.value = out.join('\n');
}
</script>

</body>
</html>
